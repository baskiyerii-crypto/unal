version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Auto-Healing & Storage Protected)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menak_pass}
      POSTGRES_DB: ${POSTGRES_DB:-menak_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - traefik.enable=false

  # -------------------------------------------------------------------
  # 2. Next.js + Payload CMS Application Service
  # -------------------------------------------------------------------
  # Coolify Domains for this service MUST include the container port:
  #   https://menakyapi.com.tr:3000
  #   https://www.menakyapi.com.tr:3000
  # Without :3000 Traefik targets port 80 → "no available server".
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URI: postgres://${POSTGRES_USER:-menak_user}:${POSTGRES_PASSWORD:-menak_pass}@postgres:5432/${POSTGRES_DB:-menak_db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://menakyapi.com.tr}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://menakyapi.com.tr}
      DOMAIN_NAME: ${DOMAIN_NAME:-menakyapi.com.tr}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    expose:
      - '3000'
    volumes:
      - media_uploads:/app/media
    labels:
      - traefik.enable=true
      # Coolify-generated service names (http-0 / https-0 + resource uuid + service)
      - traefik.http.services.http-0-${COOLIFY_RESOURCE_UUID:-local}-web.loadbalancer.server.port=3000
      - traefik.http.services.https-0-${COOLIFY_RESOURCE_UUID:-local}-web.loadbalancer.server.port=3000
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  postgres_data:
  media_uploads:
