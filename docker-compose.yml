version: '3.8'

services:
  # -------------------------------------------------------------------
  # 1. PostgreSQL Database Service (Auto-Healing & Storage Protected)
  # -------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: menakyapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-menak_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-menak_pass}
      POSTGRES_DB: ${POSTGRES_DB:-menak_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # 2. Next.js + Payload CMS Application Service
  # -------------------------------------------------------------------
  # Coolify owns Host()/TLS via Domains UI. We only tell Traefik the
  # container listens on 3000 — without this you get "no available server".
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menakyapi_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      DATABASE_URI: postgres://${POSTGRES_USER:-menak_user}:${POSTGRES_PASSWORD:-menak_pass}@postgres:5432/${POSTGRES_DB:-menak_db}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://menakyapi.com.tr}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://menakyapi.com.tr}
      DOMAIN_NAME: ${DOMAIN_NAME:-menakyapi.com.tr}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    expose:
      - '3000'
    volumes:
      - media_uploads:/app/media
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - traefik.enable=true
      - traefik.http.services.web.loadbalancer.server.port=3000

volumes:
  postgres_data:
  media_uploads:
